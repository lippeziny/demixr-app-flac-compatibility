name: Build and release app

on:
  push:
    tags:
      # Accept both short tags such as v0.1 and semantic versions such as v1.2.3.
      - 'v*'
  workflow_dispatch:
    inputs:
      build_ref:
        description: 'Branch, tag, or commit to compile (use main for the current source)'
        required: true
        default: main
        type: string
      tag_name:
        description: 'Release tag to create or update (for example v0.1 or v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

# Pin to the toolchain the project is developed against.
env:
  FLUTTER_VERSION: "3.44.9"

jobs:
  # Resolve the source exactly once so all platform builds use the same commit.
  prepare:
    name: Resolve source commit
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.build_ref || github.ref }}
          fetch-depth: 1
      - name: Pin source commit
        id: resolve
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  android:
    name: Build Android APK
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # arm64 only: the ExecuTorch (executorch_flutter) Android prebuilt ships
      # arm64-v8a only, so --split-per-abi / 32-bit builds would fail. Release
      # is debug-signed (see android/app/build.gradle) — installable, not
      # Play-Store-ready until a release keystore is configured. Retried: the
      # ExecuTorch prebuilt download has a short timeout that can flake.
      - name: Build APK
        run: |
          n=0; until flutter build apk --release --target-platform android-arm64; do
            n=$((n+1)); [ $n -ge 3 ] && exit 1
            echo "::warning::build failed (likely prebuilt download); retry $n"; sleep 20
          done
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: demixr-android
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7

  macos:
    name: Build macOS app
    needs: prepare
    # ExecuTorch's macOS prebuilt is arm64-only, so use an Apple Silicon runner.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build macOS
        run: |
          n=0; until flutter build macos --release; do
            n=$((n+1)); [ $n -ge 3 ] && exit 1
            echo "::warning::build failed (likely prebuilt download); retry $n"; sleep 20
          done
      # Remove stale signatures and AppleDouble sidecar metadata before signing.
      - name: Ad-hoc sign and verify app
        run: |
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          find "$APP/Contents" -type d -name _CodeSignature -prune -exec rm -rf {} +
          find "$APP/Contents" -name '._*' -delete
          find "$APP/Contents" -type f \
            \( -name '*.dylib' -o -perm -111 \) \
            ! -path '*/MacOS/*' -print0 |
            while IFS= read -r -d '' binary; do
              if file "$binary" | grep -q 'Mach-O'; then
                codesign --force --sign - --timestamp=none "$binary"
              fi
            done
          while IFS= read -r bundle; do
            codesign --force --sign - --timestamp=none "$bundle"
          done < <(
            find "$APP/Contents" -depth -type d \
              \( -name '*.framework' -o -name '*.appex' -o -name '*.xpc' \)
          )
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Package .dmg
        run: |
          brew install create-dmg
          APP=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          STAGE="$(mktemp -d)/dmg"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          APP_NAME=$(basename "$APP")
          create-dmg \
            --volname "Demixr" \
            --volicon "$APP/Contents/Resources/AppIcon.icns" \
            --window-pos 200 120 \
            --window-size 660 420 \
            --text-size 14 \
            --icon-size 128 \
            --icon "$APP_NAME" 170 190 \
            --hide-extension "$APP_NAME" \
            --app-drop-link 490 190 \
            --no-internet-enable \
            build/demixr-macos.dmg \
            "$STAGE"
      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: demixr-macos
          path: build/demixr-macos.dmg
          if-no-files-found: error
          retention-days: 7

  ios:
    # Build-check only: an unsigned iOS app is not installable as-is.
    name: Build iOS app (build-check, unsigned)
    needs: prepare
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS (unsigned)
        run: |
          n=0; until flutter build ios --release --no-codesign; do
            n=$((n+1)); [ $n -ge 3 ] && exit 1
            echo "::warning::build failed (likely prebuilt download); retry $n"; sleep 20
          done
      - name: Package unsigned .app
        run: |
          cd build/ios/iphoneos
          zip -r -y demixr-ios-unsigned.zip Runner.app
      - name: Upload unsigned iOS build
        uses: actions/upload-artifact@v4
        with:
          name: demixr-ios
          path: build/ios/iphoneos/demixr-ios-unsigned.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [prepare, android, macos, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - name: Download all platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: demixr-*
          path: release-assets
          merge-multiple: true
      - name: Check release assets
        run: |
          find release-assets -maxdepth 1 -type f -print
          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"
      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release-assets/*"
          tag: ${{ github.event.inputs.tag_name || github.ref_name }}
          # Required when a manual run is creating a release tag that does not exist yet.
          commit: ${{ needs.prepare.outputs.source_sha }}
          name: Demixr ${{ github.event.inputs.tag_name || github.ref_name }}
          generateReleaseNotes: true
          allowUpdates: true
          replacesArtifacts: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
